<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The digital exhibition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html,
        body {
            overflow: hidden;
        }

        .webgl {
            position: fixed;
            top: 0;
            left: 0;
            outline: none;
        }

        .information {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 1rem;
            border-radius: 10px;
            max-width: 25rem;
        }

        h2 {
            margin-bottom: 0.5rem;
        }
    </style>
    <script type="importmap">
  {
   "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/examples/jsm/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
    <canvas class="webgl"></canvas>
    <div class="information">
        <h2>Welcome in the digital exhibition</h2>
        <p>You can turn the boxes with your mouse or click on the frames for a nice effect.</p>
    </div>
    <script type="module" src="./js/script.js"></script>
</body>

</html>
